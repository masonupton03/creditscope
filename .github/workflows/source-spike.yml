name: Source spike (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test candidate sources from the runner
        run: python scripts/source_spike.py | tee spike.txt
      - name: Job summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat spike.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
