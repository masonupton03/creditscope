name: Deploy site

# Publishes the website to GitHub Pages. Runs on every push to main (code changes), and is called
# by the daily workflow after it commits new data (pushes made with GITHUB_TOKEN do not trigger it).
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main            # always the newest commit, including the bot's data commit
      - name: Stage the site (pages, research data, licence files and the two data files; raw files are not published)
        run: |
          mkdir -p _site/data
          cp index.html browse.html trends.html explorer.html fundamentals.html compare.html portfolio.html platform.html manifest.webmanifest sw.js _site/
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md _site/
          cp -R assets _site/assets
          cp -R explorer _site/explorer
          cp data/history.csv data/status.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
