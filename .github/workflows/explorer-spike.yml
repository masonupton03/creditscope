name: Explorer source spike (temporary)

# Throwaway: runs only on pushes to the development branch that touch the spike files.
on:
  push:
    branches: [feature/stock-explorer]
    paths:
      - scripts/explorer_spike.py
      - .github/workflows/explorer-spike.yml

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test Nasdaq endpoints from the runner
        run: python scripts/explorer_spike.py | tee spike.txt
      - name: Job summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat spike.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
